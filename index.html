<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تواصل مع أستاذ محمد كرافك</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Cairo:wght@400;600;700&display=swap">
<style>
/* Layout: one phone-width column, a short header, one form card and one clear send button. */
:root {
  --bg: #eef1f6;
  --ink: #14202e;
  --muted: #5b6b7e;
  --card: #ffffff;
  --line: #cdd6e2;
  --field: #f6f8fb;
  --accent: #e8590c;
  --accent-ink: #ffffff;
  --ok: #1e7a46;
  --err: #c0392b;
  --font-display: "Reem Kufi", "Cairo", "Segoe UI", Tahoma, sans-serif;
  --font-body: "Cairo", "Segoe UI", Tahoma, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1620; --ink: #edf1f7; --muted: #9aa9bc; --card: #172231; --line: #2b3a4f; --field: #101a27;
    --accent: #ff8a3d; --accent-ink: #1b0f05; --ok: #55c785; --err: #ff7b6b;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.6;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 430px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
@media (min-width: 600px) {
  body { padding-block: 24px; }
  .wrap { border: 8px solid var(--ink); border-radius: 40px; padding: 30px 18px 26px; min-height: 760px; }
}
h1 { font-family: var(--font-display); font-size: 2.1rem; line-height: 1.3; margin: 0 0 6px; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); }
form, .done {
  background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 22px;
  display: flex; flex-direction: column; gap: 18px; box-shadow: 0 10px 30px rgba(10, 20, 40, 0.08);
}
form[hidden], .done[hidden] { display: none; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
label, legend { font-weight: 700; font-size: 0.98rem; padding: 0; }
input[type="text"], input[type="tel"], textarea {
  font: 400 1rem var(--font-body); color: var(--ink); background: var(--field);
  border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; min-width: 0;
}
textarea { min-height: 120px; resize: vertical; }
input:focus-visible, textarea:focus-visible, button:focus-visible, .choice input:focus-visible + span {
  outline: 3px solid var(--accent); outline-offset: 2px;
}
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.choice span {
  display: inline-block; border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 16px;
  background: var(--field); font-weight: 600; font-size: 0.95rem;
}
.choice input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.hp { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; opacity: 0; pointer-events: none; }
.err { color: var(--err); font-size: 0.88rem; min-height: 1.2em; margin: 0; }
.send {
  font: 700 1.3rem var(--font-display); background: var(--accent); color: var(--accent-ink);
  border: 0; border-radius: 12px; padding: 15px; cursor: pointer; width: 100%;
}
.send:disabled { opacity: 0.6; cursor: wait; }
.status { margin: 0; text-align: center; font-weight: 600; min-height: 1.4em; }
.status.bad { color: var(--err); }
.done h2 { font-family: var(--font-display); font-size: 1.7rem; margin: 0; color: var(--ok); }
.done p { margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>تواصل مع أستاذ محمد كرافك</h1>
    <p class="lead">املا البيانات دي وهيتواصل معاك على الرقم اللي هتكتبه.</p>
  </header>

  <form id="form" novalidate>
    <div class="field">
      <label for="name">الاسم بالكامل</label>
      <input id="name" name="الاسم" type="text" autocomplete="name" required>
      <p class="err" id="e-name"></p>
    </div>

    <div class="field">
      <label for="phone">رقم الموبايل (واتساب)</label>
      <input id="phone" name="الموبايل" type="tel" inputmode="numeric" autocomplete="tel" placeholder="01XXXXXXXXX" dir="ltr" style="text-align:right" required>
      <p class="err" id="e-phone"></p>
    </div>

    <div class="field">
      <label for="msg">عايز تتواصل في إيه؟</label>
      <textarea id="msg" name="الرسالة" required></textarea>
      <p class="err" id="e-msg"></p>
    </div>

    <fieldset>
      <legend>أنسب وقت للتواصل</legend>
      <div class="choices">
        <label class="choice"><input type="radio" name="الوقت" value="أي وقت" checked><span>أي وقت</span></label>
        <label class="choice"><input type="radio" name="الوقت" value="الصبح"><span>الصبح</span></label>
        <label class="choice"><input type="radio" name="الوقت" value="بعد الضهر"><span>بعد الضهر</span></label>
        <label class="choice"><input type="radio" name="الوقت" value="بالليل"><span>بالليل</span></label>
      </div>
    </fieldset>

    <div class="hp" aria-hidden="true">
      <label for="website">سيبه فاضي</label>
      <input id="website" name="_gotcha" type="text" tabindex="-1" autocomplete="off">
    </div>

    <button class="send" id="send" type="submit">ابعت بياناتي</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>

  <section class="done" id="done" hidden>
    <h2>وصلتنا رسالتك</h2>
    <p>شكرًا ليك. أستاذ محمد كرافك هيتواصل معاك قريب على الرقم اللي كتبته.</p>
  </section>
</div>

<script>
(function () {
  var FORM_ENDPOINT = "https://formspree.io/f/xgaanlwz";

  var form = document.getElementById("form");
  var send = document.getElementById("send");
  var statusEl = document.getElementById("status");
  var done = document.getElementById("done");

  function toLatinDigits(s) {
    return s.replace(/[٠-٩]/g, function (d) { return "٠١٢٣٤٥٦٧٨٩".indexOf(d); })
            .replace(/[۰-۹]/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹".indexOf(d); });
  }
  function setErr(id, msg) { document.getElementById("e-" + id).textContent = msg || ""; return !msg; }

  function validate() {
    var ok = true;
    var name = document.getElementById("name").value.trim();
    ok = setErr("name", name.split(/\s+/).length >= 2 ? "" : "اكتب اسمك الأول والتاني على الأقل.") && ok;
    var phone = toLatinDigits(document.getElementById("phone").value).replace(/[\s-]/g, "");
    ok = setErr("phone", /^01[0125]\d{8}$/.test(phone) ? "" : "اكتب رقم موبايل مصري صح، من 11 رقم.") && ok;
    ok = setErr("msg", document.getElementById("msg").value.trim() ? "" : "اكتب إنت عايز تتواصل في إيه.") && ok;
    return ok;
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    statusEl.textContent = ""; statusEl.className = "status";
    if (!validate()) { statusEl.textContent = "راجع الخانات اللي فيها ملاحظات."; statusEl.className = "status bad"; return; }
    if (document.getElementById("website").value) { return; }

    var data = new FormData(form);
    data.set("الموبايل", toLatinDigits(document.getElementById("phone").value).replace(/[\s-]/g, ""));

    send.disabled = true; send.textContent = "جاري الإرسال...";
    fetch(FORM_ENDPOINT, { method: "POST", body: data, headers: { "Accept": "application/json" } })
      .then(function (r) {
        if (!r.ok) throw new Error("bad status");
        form.hidden = true; done.hidden = false; window.scrollTo(0, 0);
      })
      .catch(function () {
        statusEl.textContent = "حصلت مشكلة في الإرسال. جرّب تاني بعد شوية.";
        statusEl.className = "status bad";
        send.disabled = false; send.textContent = "ابعت بياناتي";
      });
  });
})();
</script>
</body>
</html>
